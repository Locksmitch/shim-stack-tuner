<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shim Stack Preview — Valving Toolbox</title>
    <script>
      (function () {
        var t = localStorage.getItem('sst_theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .popout-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        font-size: 12.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .popout-bar .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #16a34a;
        flex: none;
      }
      .popout-body {
        flex: 1;
        min-height: 0;
        padding: 10px;
        box-sizing: border-box;
      }
      #stackCanvas {
        width: 100%;
        height: 100%;
      }
      #emptyHint {
        margin: 40px auto 0;
        max-width: 320px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="popout-bar"><span class="dot"></span> Live-synced from the Shim Stack Tuner</div>
    <div class="popout-body">
      <canvas id="stackCanvas"></canvas>
      <p id="emptyHint" style="display: none">
        No stack computed yet — set up a shim stack in the Shim Stack Tuner tab to see it here.
      </p>
    </div>
    <script type="module">
      import { drawStackCanvas } from './js/stack-visual.js';
      import { readLiveVisualsSnapshot, subscribeLiveVisuals } from './js/live-sync.js';

      const cv = document.getElementById('stackCanvas');
      const emptyHint = document.getElementById('emptyHint');
      let last = null;

      function redraw() {
        if (!last) {
          cv.style.display = 'none';
          emptyHint.style.display = '';
          return;
        }
        cv.style.display = '';
        emptyHint.style.display = 'none';
        drawStackCanvas(cv, last.bands, last.rLoad, last.clampR, last.shaftR, last.yMaxLocked, last.resultUnit);
      }

      function applySnapshot(snap) {
        if (snap && snap.stack) {
          last = snap.stack;
          redraw();
        }
      }

      applySnapshot(readLiveVisualsSnapshot());
      subscribeLiveVisuals(applySnapshot);

      new ResizeObserver(() => redraw()).observe(cv.parentElement);
      // The native 'storage' event fires in *other* windows/tabs when localStorage changes -
      // exactly the case here (this pop-out and the main tuner tab are different windows), so
      // toggling the theme on the main page updates this window too.
      window.addEventListener('storage', (e) => {
        if (e.key === 'sst_theme' && e.newValue) {
          document.documentElement.dataset.theme = e.newValue;
          redraw();
        }
      });
    </script>
  </body>
</html>
