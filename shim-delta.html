function countShims(arr) {
  const map = {};
  arr.forEach(s => { map[s] = (map[s] || 0) + 1; });
  return map;
}

function calcDelta(fromKey, toKey) {
  const from = countShims(TUNES[fromKey].shims);
  const to   = countShims(TUNES[toKey].shims);
  const all  = new Set([...Object.keys(from), ...Object.keys(to)]);
  const remove = [], keep = [], add = [];
  all.forEach(shim => {
    const f = from[shim] || 0;
    const t = to[shim]   || 0;
    if (f > t) remove.push({ shim, qty: f - t, fromQty: f, toQty: t });
    else if (f === t && f > 0) keep.push({ shim, qty: f });
    else if (t > f) add.push({ shim, qty: t - f, fromQty: f, toQty: t });
  });
  return { remove, keep, add };
}

function shimRows(items, qtyClass, sign) {
  if (!items.length) return `<div class="empty">None</div>`;
  return items.map(it => `
    <div class="shim-row">
      <span class="qty ${qtyClass}">${sign}${it.qty}×</span>
      <span class="shim-spec">${it.shim}</span>
    </div>`).join('');
}

function render() {
  const fromKey = document.getElementById('fromTune').value;
  const toKey   = document.getElementById('toTune').value;
  const fromT = TUNES[fromKey];
  const toT   = TUNES[toKey];

  if (fromKey === toKey) {
    document.getElementById('output').innerHTML = `
      <p style="color:var(--muted);font-size:14px;">Select two different tunes to see the delta.</p>`;
    return;
  }

  const { remove, keep, add } = calcDelta(fromKey, toKey);

  document.getElementById('output').innerHTML = `
    <div class="meta">
      <strong>${fromKey}</strong> (${fromT.dwg}) → <strong>${toKey}</strong> (${toT.dwg}) &nbsp;·&nbsp;
      Stack: ${fromT.thick} → ${toT.thick}
    </div>

    <div class="summary-grid">
      <div class="stat remove">
        <div class="stat-label">− Remove</div>
        <div class="stat-val">${remove.reduce((s,i)=>s+i.qty,0)}</div>
      </div>
      <div class="stat keep">
        <div class="stat-label">✓ Keep</div>
        <div class="stat-val">${keep.reduce((s,i)=>s+i.qty,0)}</div>
      </div>
      <div class="stat add">
        <div class="stat-label">+ Add</div>
        <div class="stat-val">${add.reduce((s,i)=>s+i.qty,0)}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head head-remove">− Remove from ${fromKey}</div>
      ${shimRows(remove, 'qty-remove', '−')}
    </div>

    <div class="section">
      <div class="section-head head-keep">✓ Keep (unchanged)</div>
      ${shimRows(keep, 'qty-keep', '')}
    </div>

    <div class="section">
      <div class="section-head head-add">+ Add for ${toKey}</div>
      ${shimRows(add, 'qty-add', '+')}
    </div>
  `;
}

  fromSel.appendChild(o1);
  toSel.appendChild(o2);
});

fromSel.addEventListener('change', render);

render();
